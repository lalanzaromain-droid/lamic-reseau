// ===== CATEGORY MAPPING =====

function getCatSurgeles(code){
  if(code.startsWith('11'))return'PAINS';
  if(code.startsWith('12'))return'VIENNOISERIES';
  if(code.startsWith('14'))return'PATISSERIES';
  if(code.startsWith('21'))return'VIANDES';
  if(code.startsWith('22'))return'TRAITEUR';
  if(code.startsWith('80'))return'DIVERS';
  return'AUTRE';
}

function getCatFrais(code){
  if(code.startsWith('111'))return'CEREALES';
  if(code.startsWith('14'))return'DECORS & INGREDIENTS';
  if(code.startsWith('31AZ'))return'CAFE & THES';
  if(code.startsWith('31A'))return'BOISSONS CHAUDES & SIROPS';
  if(code.startsWith('31J'))return'JUS';
  if(code.startsWith('31'))return'BOISSONS CHAUDES & SIROPS';
  if(code.startsWith('33'))return'GLACES & GRANITES';
  if(code.startsWith('84'))return'EMBALLAGES';
  if(code.startsWith('81'))return'MATIERES PREMIERES';
  if(code.startsWith('80'))return'EPICERIE & FRAIS';
  return'AUTRE';
}

function getCatBoissons(code){
  if(code.startsWith('32'))return'CONFISERIES';
  if(code.startsWith('31'))return'BOISSONS';
  return'AUTRE';
}

// ===== PARSE CONDITIONNEMENT =====

function parseCondNombre(cond){
  if(!cond)return null;
  const m=cond.match(/(\d+)/);
  return m?parseInt(m[1]):null;
}

// ===== SEED FUNCTION =====

const DATA_MAP={surgeles:SURGELES,frais:FRAIS,boissons:BOISSONS};
const CAT_MAP={surgeles:getCatSurgeles,frais:getCatFrais,boissons:getCatBoissons};

window.seed=async function(type){
  if(!loggedIn){alert('Vous devez etre connecte !');return;}
  const btn=document.getElementById('btn-'+type);
  const counter=document.getElementById('counter-'+type);
  const logEl=document.getElementById('log-'+type);
  const items=DATA_MAP[type];
  const getCat=CAT_MAP[type];

  btn.disabled=true;
  btn.textContent='Chargement...';
  logEl.innerHTML='';
  logEl.classList.add('visible');
  counter.textContent='0 / '+items.length;

  const produits={};
  for(let i=0;i<items.length;i++){
    const[nom,cond,ref_f,code]=items[i];
    const cleanCode=code.replace(/\s+/g,'').replace(/[\/%.#$\[\]]/g,'_');
    const condNombre=parseCondNombre(cond);
    const categorie=getCat(cleanCode);
    produits[cleanCode]={
      nom:nom,
      ref_fournisseur:ref_f,
      code:cleanCode,
      conditionnement:cond||null,
      conditionnement_nombre:condNombre,
      ordre_fournisseur:i+1,
      categorie:categorie,
      actif:true,
      ventes_jour_defaut:null,
      stock_mini:0
    };
    logEl.innerHTML+='<p style="color:#2e7d32">OK '+cleanCode+' — '+nom+'</p>';
    counter.textContent=(i+1)+' / '+items.length;
  }

  try{
    await setDoc(doc(db,'catalogues',type),{produits:produits});
    btn.textContent='Done ! '+items.length+' produits charges (1 doc)';
    btn.classList.add('done');
    counter.textContent=items.length+' produits en 1 document';
  }catch(e){
    btn.textContent='Erreur !';
    btn.classList.add('error');
    logEl.innerHTML+='<p style="color:#e53935">ERREUR ecriture : '+e.message+'</p>';
  }
};
</script>
