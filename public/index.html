<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Team Connect — Module Reseau</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Team Connect</h1>
      <p class="subtitle">Module Reseau</p>

      <div id="login-error" class="login-error"></div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="votre@email.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full" id="btn-login">Se connecter</button>
      <div id="forgot-link" onclick="forgotPassword()" style="cursor:pointer;color:#3b82f6;font-weight:700;font-size:.82rem;margin-top:12px;text-decoration:underline;text-align:center">Mot de passe oublie ?</div>
    </div>
  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail } from './js/firebase-config.js';

    window.forgotPassword = async function() {
      const email = document.getElementById('email').value.trim();
      const errorDiv = document.getElementById('login-error');
      if (!email) { showError('Entrez votre email d\'abord'); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        errorDiv.style.display = 'block';
        errorDiv.style.color = '#2e7d32';
        errorDiv.textContent = 'Email envoye ! Verifiez votre boite mail et vos courriers indesirables (spam).';
      } catch (e) {
        showError('Erreur: ' + (e.code === 'auth/user-not-found' ? 'Aucun compte avec cet email' : e.message));
      }
    };

    // Si déjà connecté, rediriger
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'commande.html';
    });

    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const btnLogin = document.getElementById('btn-login');
    const errorDiv = document.getElementById('login-error');

    btnLogin.addEventListener('click', doLogin);
    passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if (!email || !pass) { showError('Remplissez tous les champs'); return; }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Connexion...';
      errorDiv.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = 'commande.html';
      } catch (err) {
        const messages = {
          'auth/invalid-credential': 'Email ou mot de passe incorrect',
          'auth/user-not-found': 'Aucun compte avec cet email',
          'auth/wrong-password': 'Mot de passe incorrect',
          'auth/too-many-requests': 'Trop de tentatives, réessayez plus tard'
        };
        showError(messages[err.code] || 'Erreur de connexion');
        document.getElementById('forgot-link').style.display = 'block';
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Se connecter';
      }
    }

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
