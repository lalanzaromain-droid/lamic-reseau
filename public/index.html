<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>La Mie Câline — Commande</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>La Mie Caline</h1>
      <p class="subtitle">Module Commande</p>

      <div id="login-error" class="login-error"></div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="votre@email.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full" id="btn-login">Se connecter</button>
    </div>
  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword } from './js/firebase-config.js';

    // Si déjà connecté, rediriger
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'commande.html';
    });

    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const btnLogin = document.getElementById('btn-login');
    const errorDiv = document.getElementById('login-error');

    btnLogin.addEventListener('click', doLogin);
    passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if (!email || !pass) { showError('Remplissez tous les champs'); return; }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Connexion...';
      errorDiv.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = 'commande.html';
      } catch (err) {
        const messages = {
          'auth/invalid-credential': 'Email ou mot de passe incorrect',
          'auth/user-not-found': 'Aucun compte avec cet email',
          'auth/wrong-password': 'Mot de passe incorrect',
          'auth/too-many-requests': 'Trop de tentatives, réessayez plus tard'
        };
        showError(messages[err.code] || 'Erreur de connexion');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Se connecter';
      }
    }

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
