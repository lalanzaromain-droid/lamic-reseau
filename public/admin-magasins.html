<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Gestion Magasins</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--font:-apple-system,BlinkMacSystemFont,sans-serif;--brown:#3e2723;--gr:#999;--be:#e8e0d0;--wh:#FFF8E7;--r:16px;--sh:0 2px 12px rgba(0,0,0,.08)}
body{font-family:var(--font);background:#f5f0ff;min-height:100vh}
header{background:linear-gradient(160deg,#ab47bc,#7b1fa2);padding:16px 20px;color:#fff;display:flex;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-size:1.3rem}
header h1{font-size:1.05rem;font-weight:900}
.wrap{max-width:500px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:1rem;color:var(--brown);margin-bottom:14px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--gr);margin-bottom:4px;margin-top:10px}
label:first-child{margin-top:0}
input[type="text"],input[type="email"],input[type="tel"]{width:100%;padding:12px;border:3px solid var(--be);border-radius:12px;font-size:.95rem;font-weight:700;color:var(--brown);background:var(--wh);font-family:var(--font)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:var(--font);margin-top:16px}
.btn-primary{background:linear-gradient(145deg,#ab47bc,#7b1fa2);color:#fff;box-shadow:0 4px 0 #6a1b9a}
.btn-primary:disabled{background:#ccc;box-shadow:none}
.result{margin-top:14px;padding:14px;border-radius:12px;font-size:.85rem;font-weight:700;display:none}
.result.ok{display:block;background:#e8f5e9;color:#166534}
.result.err{display:block;background:#fef2f2;color:#991b1b}
.mag-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--be)}
.mag-item:last-child{border-bottom:none}
.mag-name{font-weight:800;font-size:.9rem;color:var(--brown)}
.mag-detail{font-size:.75rem;color:var(--gr)}
#mag-list-content{min-height:40px}
</style>
</head><body>
<header>
  <a href="home.html">&#8249;</a>
  <h1>Gestion Magasins</h1>
</header>
<div class="wrap">

  <!-- Liste magasins existants -->
  <div class="card">
    <h2>Magasins enregistr&eacute;s</h2>
    <div id="mag-list-content"><div style="color:var(--gr);font-size:.85rem">Chargement...</div></div>
  </div>

  <!-- Formulaire création -->
  <div class="card">
    <h2>Inscrire un nouveau magasin</h2>
    <div style="font-size:.75rem;color:var(--gr);margin-bottom:10px;font-weight:700">&#9888;&#65039; Respectez les majuscules / minuscules. L'identifiant magasin sera g&eacute;n&eacute;r&eacute; automatiquement.</div>
    <label>Nom du magasin *</label>
    <input type="text" id="f-nom" placeholder="">
    <label>Ville</label>
    <input type="text" id="f-ville" placeholder="">
    <label>Responsable (nom pr&eacute;nom)</label>
    <input type="text" id="f-responsable" placeholder="">
    <label>Email *</label>
    <input type="email" id="f-email" placeholder="">
    <label>T&eacute;l&eacute;phone</label>
    <input type="tel" id="f-tel" placeholder="">

    <button class="btn btn-primary" id="btn-create" onclick="createMagasin()">Cr&eacute;er le compte</button>
    <div id="result" class="result"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app-check.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

var fApp = initializeApp({
  apiKey:'AIzaSyAHNdciMVNz15NoAXfc7yi9q4EnQJW8PKE',
  authDomain:'teamconnect-valence-2026.firebaseapp.com',
  projectId:'teamconnect-valence-2026',
  storageBucket:'teamconnect-valence-2026.firebasestorage.app',
  messagingSenderId:'47179706726',
  appId:'1:47179706726:web:6403fd5f9dc9a3e10518a7'
});
initializeAppCheck(fApp, { provider: new ReCaptchaV3Provider('6LcCmfMsAAAAAIORt9Br0MbH8Y6Cjqe7TV-hw6HH'), isTokenAutoRefreshEnabled: true });
var auth = getAuth(fApp);
var db = getFirestore(fApp);
var currentUser = null;

onAuthStateChanged(auth, async function(user) {
  if (!user) { location.href = 'commande.html'; return; }
  // Vérifier admin
  var userDoc = await getDoc(doc(db, 'users', user.uid));
  if (!userDoc.exists() || userDoc.data().role !== 'admin' || user.email !== 'test-team-connect@gmail.com') {
    document.querySelector('.wrap').innerHTML = '<div class="card" style="text-align:center"><div style="font-size:3rem">&#x1F512;</div><div style="font-weight:700;margin-top:8px;color:var(--brown)">Acc&egrave;s admin uniquement</div></div>';
    return;
  }
  currentUser = user;
  loadMagasins();
});

async function loadMagasins() {
  var container = document.getElementById('mag-list-content');
  try {
    var snap = await getDocs(collection(db, 'magasins'));
    if (snap.empty) { container.innerHTML = '<div style="color:var(--gr);font-size:.85rem">Aucun magasin</div>'; return; }
    var html = '';
    snap.docs.forEach(function(d) {
      var m = d.data();
      html += '<div class="mag-item"><div><div class="mag-name">' + (m.nom || d.id) + '</div>' +
        '<div class="mag-detail">' + (m.ville || '') + (m.responsable ? ' — ' + m.responsable : '') + '</div></div>' +
        '<div style="font-size:.7rem;color:var(--gr);text-align:right">' + d.id + '</div></div>';
    });
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<div style="color:#dc2626;font-size:.85rem">Erreur: ' + e.message + '</div>';
  }
}

window.createMagasin = async function() {
  var nom = document.getElementById('f-nom').value.trim();
  var ville = document.getElementById('f-ville').value.trim();
  var responsable = document.getElementById('f-responsable').value.trim();
  var email = document.getElementById('f-email').value.trim();
  var telephone = document.getElementById('f-tel').value.trim();
  var resultEl = document.getElementById('result');
  resultEl.className = 'result'; resultEl.style.display = 'none';

  if (!nom || !email) {
    resultEl.className = 'result err';
    resultEl.textContent = 'Nom du magasin et email sont obligatoires';
    resultEl.style.display = 'block';
    return;
  }

  var btn = document.getElementById('btn-create');
  btn.disabled = true; btn.textContent = 'Création en cours...';

  try {
    var token = await currentUser.getIdToken();
    var resp = await fetch('https://us-central1-teamconnect-valence-2026.cloudfunctions.net/createMagasin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ nom: nom, ville: ville, responsable: responsable, email: email, telephone: telephone })
    });
    var data = await resp.json();
    if (data.success) {
      resultEl.className = 'result ok';
      resultEl.innerHTML = '&#10003; Magasin <b>' + nom + '</b> créé !<br>Compte <b>' + email + '</b> créé.<br><br>' +
        'Un email de création de mot de passe a été généré.<br>' +
        '<a href="' + data.resetLink + '" target="_blank" style="color:#7b1fa2;font-weight:800">&#128279; Lien de réinitialisation</a><br>' +
        '<span style="font-size:.75rem;color:var(--gr)">Envoyez ce lien au responsable pour qu\'il choisisse son mot de passe.</span>';
      // Reset form
      document.getElementById('f-nom').value = '';
      document.getElementById('f-ville').value = '';
      document.getElementById('f-responsable').value = '';
      document.getElementById('f-email').value = '';
      document.getElementById('f-tel').value = '';
      loadMagasins();
    } else {
      resultEl.className = 'result err';
      resultEl.textContent = 'Erreur: ' + (data.error || 'inconnue');
    }
  } catch(e) {
    resultEl.className = 'result err';
    resultEl.textContent = 'Erreur: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Créer le compte';
};
</script>
</body></html>
