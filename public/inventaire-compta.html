<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Team Connect — Inventaire Comptable</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#2e7d32;--goldl:#81c784;--goldbg:#f5faf5;--brown:#1b5e20;
  --wh:#fff;--be:#e0e0e0;--gr:#999;--grl:#f3f4f6;
  --re:#e53935;--rel:#ffebee;
  --gn:#22c55e;--gnl:#dcfce7;
  --or:#f97316;--orl:#ffedd5;
  --bl:#3b82f6;--bll:#dbeafe;
  --font:'Nunito',sans-serif;--r:16px;--sh:0 2px 12px rgba(0,0,0,0.06);
}
html,body{height:100%;font-family:var(--font);background:var(--goldbg);color:#333;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);cursor:pointer;border:none;outline:none}
input,select{font-family:var(--font);outline:none}

header{background:linear-gradient(160deg,#43a047 0%,#2e7d32 50%,#1b5e20 100%);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(46,125,50,0.3);position:sticky;top:0;z-index:10}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-left .logo{font-size:1.6rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.hdr-left .name{font-size:.6rem;font-weight:700;color:rgba(255,255,255,.6);line-height:1;letter-spacing:1px;text-transform:uppercase}
.hdr-left .title{font-size:1.05rem;font-weight:900;color:#fff;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.back-btn{background:none;border:none;font-size:28px;color:#fff;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}

.main{padding:16px;max-width:700px;margin:0 auto;padding-bottom:120px}
.card{background:var(--wh);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}

/* Steps */
.steps{display:flex;gap:4px;margin-bottom:16px}
.step{flex:1;padding:10px 6px;border-radius:12px;background:var(--wh);border:2px solid var(--be);font-weight:800;font-size:.78rem;color:var(--gr);text-align:center}
.step.active{background:linear-gradient(145deg,#43a047,#2e7d32);border-color:#2e7d32;color:#fff;box-shadow:0 3px 0 #1b5e20}
.step.done{background:#dcfce7;border-color:#22c55e;color:#166534}

/* Family header */
.fam-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-radius:14px;margin:8px 0 4px;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#fff;font-weight:900;font-size:.95rem;-webkit-tap-highlight-color:transparent}
.fam-header .arrow{font-size:1rem;transition:transform .2s}
.fam-header .arrow.open{transform:rotate(90deg)}
.fam-header .badge{margin-left:auto;background:rgba(255,255,255,.25);border-radius:10px;padding:2px 10px;font-size:.72rem;font-weight:800}

/* Product row */
.prod-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #f0f0f0;transition:background .15s}
.prod-row:last-child{border-bottom:none}
.prod-row.excluded{opacity:.4;text-decoration:line-through}
.prod-check{width:24px;height:24px;accent-color:#2e7d32;flex-shrink:0}
.prod-nom{font-weight:700;font-size:.85rem;color:#333;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-ref{font-size:.7rem;color:#999;font-weight:600;flex-shrink:0}

/* Saisie row */
.saisie-row{padding:12px;border-bottom:1px solid #f0f0f0;background:var(--wh)}
.saisie-row.filled{background:#f0fdf4}
.saisie-nom{font-weight:800;font-size:.88rem;color:#333;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saisie-ref{font-size:.7rem;color:#999;font-weight:600}
.saisie-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.saisie-field{display:flex;flex-direction:column;gap:2px}
.saisie-label{font-size:.68rem;font-weight:800;color:#666;text-transform:uppercase}
.saisie-input{width:100%;height:44px;border:2px solid #e0e0e0;border-radius:10px;font-size:1.1rem;font-weight:900;text-align:center;color:#333;background:#fafafa;-webkit-appearance:none}
.saisie-input:focus{border-color:#2e7d32;background:#fff}
.saisie-input.has-val{border-color:#22c55e;background:#f0fdf4}
.saisie-valeur{margin-top:6px;text-align:right;font-size:.82rem;font-weight:800;color:#2e7d32}

/* Recap */
.recap-table{width:100%;border-collapse:collapse;font-size:.85rem}
.recap-table th{text-align:left;padding:10px 8px;background:#f0f0f0;font-weight:900;color:#333;border-bottom:2px solid #ddd}
.recap-table td{padding:8px;border-bottom:1px solid #f0f0f0}
.recap-table .fam-row td{font-weight:800;background:#fafafa}
.recap-table .total-row td{font-weight:900;font-size:1rem;background:#e8f5e9;border-top:3px solid #2e7d32;color:#1b5e20}
.recap-table .val{text-align:right;font-variant-numeric:tabular-nums}

/* Buttons */
.btn-p{background:linear-gradient(145deg,#43a047,#1b5e20);color:#fff;font-weight:800;font-size:1rem;padding:14px 24px;border-radius:var(--r);width:100%;box-shadow:0 4px 0 #0d3b0f}
.btn-p:active{transform:translateY(2px);box-shadow:0 2px 0 #0d3b0f}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:var(--wh);color:#2e7d32;font-weight:800;font-size:.9rem;padding:12px 20px;border-radius:var(--r);width:100%;border:2px solid #2e7d32}
.btn-s:active{background:#f0fdf4}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn-p,.btn-row .btn-s{flex:1}

/* Search */
.search-box{width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:12px;font-size:.9rem;font-weight:700;color:#333;background:var(--wh);margin-bottom:12px}
.search-box:focus{border-color:#2e7d32}

/* Floating bar */
.floating-bar{position:fixed;bottom:0;left:0;right:0;background:var(--wh);padding:12px 16px;box-shadow:0 -2px 12px rgba(0,0,0,.1);z-index:50;display:flex;align-items:center;gap:12px}
.floating-total{font-weight:900;font-size:1.1rem;color:#1b5e20;flex:1}
.floating-count{font-size:.78rem;color:#666;font-weight:700}

@media(min-width:768px){.main{max-width:900px}}
</style>
</head>

<header>
  <div class="hdr-left">
    <button class="back-btn" onclick="window.location.href='/commande.html'">&#8249;</button>
    <span class="logo">&#x1F4CA;</span>
    <div>
      <div class="name">LA MIE CALINE</div>
      <div class="title">Inventaire Comptable</div>
    </div>
  </div>
  <div id="user-badge" style="background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:4px 12px;font-size:.8rem;font-weight:700"></div>
</header>

<div class="main">
  <!-- STEPS -->
  <div class="steps">
    <div class="step active" id="step1">1. Selection</div>
    <div class="step" id="step2">2. Saisie</div>
    <div class="step" id="step3">3. Recap</div>
  </div>

  <!-- VIEW 1 : SELECTION -->
  <div id="view-selection">
    <div class="card" style="text-align:center;border:2px solid #c8e6c9">
      <div style="font-size:1.1rem;font-weight:900;color:#1b5e20;margin-bottom:4px">Selection des produits</div>
      <div style="font-size:.82rem;color:#666">Decochez les produits que vous n'avez pas en stock</div>
    </div>
    <input type="text" class="search-box" id="search-sel" placeholder="Rechercher un produit..." oninput="filterSelection()">
    <div id="selection-list"></div>
    <div style="height:16px"></div>
    <button class="btn-p" onclick="goToSaisie()">Continuer vers la saisie &#8594;</button>
  </div>

  <!-- VIEW 2 : SAISIE -->
  <div id="view-saisie" style="display:none">
    <div class="card" style="text-align:center;border:2px solid #c8e6c9">
      <div style="font-size:1.1rem;font-weight:900;color:#1b5e20;margin-bottom:4px" id="saisie-title">Saisie des quantites et prix</div>
      <div style="font-size:.82rem;color:#666" id="saisie-subtitle">Renseignez les cartons, unites et prix d'achat HT</div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="text" class="search-box" id="search-saisie" placeholder="Rechercher..." oninput="filterSaisie()" style="margin-bottom:0;flex:1">
      <button onclick="filterSaisieVides()" id="btn-filter-vides" style="background:#fff;border:2px solid #e0e0e0;border-radius:12px;padding:8px 12px;font-family:var(--font);font-weight:800;font-size:.75rem;color:#666;white-space:nowrap;flex-shrink:0">Non saisis</button>
    </div>
    <div id="saisie-familles"></div>
    <div id="saisie-list"></div>
    <div style="height:16px"></div>
    <div class="btn-row">
      <button class="btn-s" onclick="goToSelection()">&#8592; Retour</button>
      <button class="btn-p" onclick="goToRecap()">Voir le recap &#8594;</button>
    </div>
  </div>

  <!-- VIEW 3 : RECAP -->
  <div id="view-recap" style="display:none">
    <div class="card" style="text-align:center;border:2px solid #c8e6c9">
      <div style="font-size:1.1rem;font-weight:900;color:#1b5e20;margin-bottom:4px">Recapitulatif par famille</div>
      <div style="font-size:.82rem;color:#666" id="recap-date"></div>
    </div>
    <div class="card" id="recap-content"></div>
    <div class="btn-row">
      <button class="btn-s" onclick="goToSaisieFromRecap()">&#8592; Modifier</button>
      <button class="btn-p" onclick="exportExcel()" style="background:linear-gradient(145deg,#1565c0,#0d47a1);box-shadow:0 4px 0 #0a3a7e">&#128196; Excel</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn-p" onclick="exportPDF()">&#128196; PDF</button>
      <button class="btn-p" onclick="saveSession()" style="background:linear-gradient(145deg,#e65100,#bf360c);box-shadow:0 4px 0 #8c2600">&#128190; Sauvegarder</button>
    </div>
  </div>
</div>

<!-- FLOATING BAR (saisie) -->
<div class="floating-bar" id="floating-bar" style="display:none">
  <div>
    <div class="floating-total" id="floating-total">0,00 EUR</div>
    <div class="floating-count" id="floating-count">0 produits saisis</div>
  </div>
</div>

// ─── BROUILLON (localStorage) ─────────────────────────────
function loadBrouillon() {
  try {
    var b = JSON.parse(localStorage.getItem('inv_compta_brouillon') || 'null');
    if (b && b.selected) selected = b.selected;
    if (b && b.saisie) saisie = b.saisie;
    if (b && b.ts) {
      var d = new Date(b.ts);
      console.log('Brouillon restaure du ' + d.toLocaleString('fr-FR'));
    }
  } catch(e) {}
}

function saveBrouillon() {
  try {
    localStorage.setItem('inv_compta_brouillon', JSON.stringify({
      selected: selected, saisie: saisie, ts: Date.now()
    }));
  } catch(e) {}
}

loadBrouillon();

// ─── LOAD TARIFS FROM FIREBASE ────────────────────────────
fbReady.then(function() {
  get(ref(db, 'inventaire-compta/tarifs')).then(function(snap) {
    var data = snap.val();
    if (data) {
      tarifs = data;
      // Pre-fill saisie prix from tarifs
      for (var r in tarifs) {
        if (!saisie[r]) saisie[r] = {};
        if (saisie[r].prix === undefined || saisie[r].prix === null) {
          saisie[r].prix = tarifs[r];
        }
      }
      console.log('Tarifs charges: ' + Object.keys(tarifs).length);
    }
  });
});

// ─── GROUP PRODUCTS BY FAMILY ─────────────────────────────
function getProductsByFamily() {
  var byFam = {};
  for (var i = 0; i < PRODUITS_SIEGE.length; i++) {
    var p = PRODUITS_SIEGE[i];
    var fam = p[2];
    if (!byFam[fam]) byFam[fam] = [];
    byFam[fam].push({ref: p[0], nom: p[1], famille: fam});
  }
  return byFam;
}

// ─── RENDER SELECTION ─────────────────────────────────────
function renderSelection() {
  var container = document.getElementById('selection-list');
  var byFam = getProductsByFamily();
  var search = (document.getElementById('search-sel').value || '').toLowerCase().trim();
  var html = '';

  for (var fi = 0; fi < FAMILLES_ORDER.length; fi++) {
    var fam = FAMILLES_ORDER[fi];
    var prods = byFam[fam];
    if (!prods || prods.length === 0) continue;

    var filtered = prods;
    if (search) {
      filtered = prods.filter(function(p) {
        return p.nom.toLowerCase().indexOf(search) >= 0 || p.ref.indexOf(search) >= 0;
      });
      if (filtered.length === 0) continue;
    }

    var nbSel = 0;
    for (var j = 0; j < filtered.length; j++) {
      if (selected[filtered[j].ref]) nbSel++;
    }

    var color = FAMILLES_COLORS[fam] || '#666';
    var icon = FAMILLES_ICONS[fam] || '';
    var isOpen = famOpenSel[fam] !== false;
    if (search) isOpen = true;

    html += '<div class="fam-header" style="background:' + color + '" onclick="toggleFamSel(\'' + fam.replace(/'/g,"\\'") + '\')">';
    html += '<span class="arrow ' + (isOpen ? 'open' : '') + '" id="arrow-sel-' + fi + '">&#9654;</span>';
    html += '<span>' + icon + ' ' + fam + '</span>';
    html += '<span class="badge">' + nbSel + '/' + filtered.length + '</span>';
    html += '<button onclick="event.stopPropagation();toggleAllFam(\'' + fam.replace(/'/g,"\\'") + '\')" style="background:rgba(255,255,255,.3);border:none;border-radius:8px;padding:4px 10px;font-family:var(--font);font-weight:800;font-size:.68rem;color:#fff;cursor:pointer">' + (nbSel === filtered.length ? 'Tout decocher' : 'Tout cocher') + '</button>';
    html += '</div>';

    html += '<div id="fam-sel-' + fi + '" style="display:' + (isOpen ? 'block' : 'none') + ';background:#fff;border-radius:0 0 14px 14px;box-shadow:0 2px 6px rgba(0,0,0,.04);margin-bottom:4px">';
    for (var k = 0; k < filtered.length; k++) {
      var p = filtered[k];
      var checked = selected[p.ref] ? 'checked' : '';
      html += '<div class="prod-row ' + (selected[p.ref] ? '' : 'excluded') + '">';
      html += '<input type="checkbox" class="prod-check" ' + checked + ' onchange="toggleProd(\'' + p.ref + '\',this.checked)">';
      html += '<span class="prod-nom">' + p.nom + '</span>';
      html += '<span class="prod-ref">#' + p.ref + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  container.innerHTML = html || '<div style="padding:20px;text-align:center;color:#999">Aucun produit trouve</div>';
}

window.toggleFamSel = function(fam) {
  famOpenSel[fam] = famOpenSel[fam] === false ? true : false;
  renderSelection();
};

window.toggleAllFam = function(fam) {
  var byFam = getProductsByFamily();
  var prods = byFam[fam] || [];
  var allSel = prods.every(function(p) { return selected[p.ref]; });
  for (var i = 0; i < prods.length; i++) {
    selected[prods[i].ref] = !allSel;
  }
  saveBrouillon();
  renderSelection();
};

window.toggleProd = function(refP, checked) {
  selected[refP] = checked;
  saveBrouillon();
  // Update row class without full re-render
  renderSelection();
};

window.filterSelection = function() { renderSelection(); };

// ─── RENDER SAISIE ────────────────────────────────────────
function renderSaisie() {
  var container = document.getElementById('saisie-list');
  var byFam = getProductsByFamily();
  var search = (document.getElementById('search-saisie').value || '').toLowerCase().trim();
  var html = '';
  var totalProds = 0;

  for (var fi = 0; fi < FAMILLES_ORDER.length; fi++) {
    var fam = FAMILLES_ORDER[fi];
    var prods = byFam[fam];
    if (!prods || prods.length === 0) continue;

    // Only selected products
    var selProds = prods.filter(function(p) { return selected[p.ref]; });
    if (selProds.length === 0) continue;

    var filtered = selProds;
    if (search) {
      filtered = selProds.filter(function(p) {
        return p.nom.toLowerCase().indexOf(search) >= 0 || p.ref.indexOf(search) >= 0;
      });
      if (filtered.length === 0) continue;
    }
    if (showOnlyVides) {
      filtered = filtered.filter(function(p) {
        var s = saisie[p.ref] || {};
        return !s.prix || (!s.cartons && s.cartons !== 0 && !s.unites && s.unites !== 0);
      });
      if (filtered.length === 0) continue;
    }

    totalProds += filtered.length;

    var nbSaisi = 0;
    for (var j = 0; j < filtered.length; j++) {
      var s = saisie[filtered[j].ref] || {};
      if (s.prix && (s.cartons || s.cartons === 0 || s.unites || s.unites === 0)) nbSaisi++;
    }

    var color = FAMILLES_COLORS[fam] || '#666';
    var icon = FAMILLES_ICONS[fam] || '';
    var isOpen = famOpenSaisie[fam] !== false;
    if (search || showOnlyVides) isOpen = true;

    html += '<div class="fam-header" style="background:' + color + '" onclick="toggleFamSaisie(\'' + fam.replace(/'/g,"\\'") + '\')">';
    html += '<span class="arrow ' + (isOpen ? 'open' : '') + '">&#9654;</span>';
    html += '<span>' + icon + ' ' + fam + '</span>';
    html += '<span class="badge">' + nbSaisi + '/' + filtered.length + '</span>';
    html += '</div>';

    html += '<div style="display:' + (isOpen ? 'block' : 'none') + ';background:#fff;border-radius:0 0 14px 14px;box-shadow:0 2px 6px rgba(0,0,0,.04);margin-bottom:4px;overflow:hidden">';
    for (var k = 0; k < filtered.length; k++) {
      var p = filtered[k];
      var s = saisie[p.ref] || {};
      var hasPrix = s.prix > 0;
      var hasQty = (s.cartons > 0 || s.unites > 0);
      var valeur = calcValeur(p.ref);
      var isFilled = hasPrix && hasQty;

      html += '<div class="saisie-row ' + (isFilled ? 'filled' : '') + '" id="srow-' + p.ref + '">';
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="saisie-nom" style="flex:1">' + p.nom + '</span><span class="saisie-ref">#' + p.ref + '</span></div>';
      html += '<div class="saisie-fields">';
      html += '<div class="saisie-field"><span class="saisie-label">Prix HT</span><input type="number" step="0.01" min="0" class="saisie-input ' + (hasPrix ? 'has-val' : '') + '" value="' + (s.prix || '') + '" placeholder="0.00" inputmode="decimal" onchange="onPrix(\'' + p.ref + '\',this.value)" onfocus="this.select()"></div>';
      html += '<div class="saisie-field"><span class="saisie-label">Cartons</span><input type="number" step="1" min="0" class="saisie-input ' + (s.cartons > 0 ? 'has-val' : '') + '" value="' + (s.cartons !== undefined && s.cartons !== null ? s.cartons : '') + '" placeholder="0" inputmode="numeric" onchange="onCartons(\'' + p.ref + '\',this.value)" onfocus="this.select()"></div>';
      html += '<div class="saisie-field"><span class="saisie-label">Unites</span><input type="number" step="1" min="0" class="saisie-input ' + (s.unites > 0 ? 'has-val' : '') + '" value="' + (s.unites !== undefined && s.unites !== null ? s.unites : '') + '" placeholder="0" inputmode="numeric" onchange="onUnites(\'' + p.ref + '\',this.value)" onfocus="this.select()"></div>';
      html += '</div>';
      if (valeur > 0) {
        html += '<div class="saisie-valeur">= ' + valeur.toFixed(2) + ' EUR</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  container.innerHTML = html || '<div style="padding:20px;text-align:center;color:#999">Aucun produit</div>';

  var selCount = Object.keys(selected).filter(function(r) { return selected[r]; }).length;
  document.getElementById('saisie-subtitle').textContent = selCount + ' produits selectionnes';
  updateFloating();
}

function calcValeur(refP) {
  var s = saisie[refP] || {};
  var prix = parseFloat(s.prix) || 0;
  var cartons = parseInt(s.cartons) || 0;
  var unites = parseInt(s.unites) || 0;
  var total = cartons + unites;
  return total * prix;
}

function updateFloating() {
  var totalVal = 0;
  var nbSaisi = 0;
  for (var i = 0; i < PRODUITS_SIEGE.length; i++) {
    var r = PRODUITS_SIEGE[i][0];
    if (!selected[r]) continue;
    var v = calcValeur(r);
    if (v > 0) { totalVal += v; nbSaisi++; }
  }
  document.getElementById('floating-total').textContent = totalVal.toFixed(2) + ' EUR';
  document.getElementById('floating-count').textContent = nbSaisi + ' produit' + (nbSaisi > 1 ? 's' : '') + ' valorise' + (nbSaisi > 1 ? 's' : '');
}

window.onPrix = function(refP, val) {
  if (!saisie[refP]) saisie[refP] = {};
  saisie[refP].prix = val ? parseFloat(val) : null;
  // Save tarif to Firebase
  if (val) {
    tarifs[refP] = parseFloat(val);
    fbReady.then(function() {
      set(ref(db, 'inventaire-compta/tarifs/' + refP), parseFloat(val));
    });
  }
  saveBrouillon();
  var row = document.getElementById('srow-' + refP);
  if (row) {
    var v = calcValeur(refP);
    var valDiv = row.querySelector('.saisie-valeur');
    if (v > 0) {
      if (!valDiv) {
        valDiv = document.createElement('div');
        valDiv.className = 'saisie-valeur';
        row.appendChild(valDiv);
      }
      valDiv.textContent = '= ' + v.toFixed(2) + ' EUR';
      row.classList.add('filled');
    } else if (valDiv) {
      valDiv.textContent = '';
      row.classList.remove('filled');
    }
  }
  updateFloating();
};

window.onCartons = function(refP, val) {
  if (!saisie[refP]) saisie[refP] = {};
  saisie[refP].cartons = val !== '' ? parseInt(val) : null;
  saveBrouillon();
  window.onPrix(refP, saisie[refP].prix || '');
};

window.onUnites = function(refP, val) {
  if (!saisie[refP]) saisie[refP] = {};
  saisie[refP].unites = val !== '' ? parseInt(val) : null;
  saveBrouillon();
  window.onPrix(refP, saisie[refP].prix || '');
};

window.toggleFamSaisie = function(fam) {
  famOpenSaisie[fam] = famOpenSaisie[fam] === false ? true : false;
  renderSaisie();
};

window.filterSaisie = function() { showOnlyVides = false; document.getElementById('btn-filter-vides').style.borderColor = '#e0e0e0'; document.getElementById('btn-filter-vides').style.color = '#666'; renderSaisie(); };
window.filterSaisieVides = function() {
  showOnlyVides = !showOnlyVides;
  document.getElementById('btn-filter-vides').style.borderColor = showOnlyVides ? '#e53935' : '#e0e0e0';
  document.getElementById('btn-filter-vides').style.color = showOnlyVides ? '#e53935' : '#666';
  renderSaisie();
};

// ─── RENDER RECAP ─────────────────────────────────────────
function renderRecap() {
  var byFam = getProductsByFamily();
  var html = '<table class="recap-table">';
  html += '<thead><tr><th>Famille</th><th>Produits</th><th class="val">Valeur HT</th></tr></thead><tbody>';

  var totalGeneral = 0;
  var totalProduits = 0;

  for (var fi = 0; fi < FAMILLES_ORDER.length; fi++) {
    var fam = FAMILLES_ORDER[fi];
    var prods = byFam[fam];
    if (!prods) continue;

    var selProds = prods.filter(function(p) { return selected[p.ref]; });
    if (selProds.length === 0) continue;

    var famTotal = 0;
    var famCount = 0;
    var detailRows = '';

    for (var j = 0; j < selProds.length; j++) {
      var p = selProds[j];
      var v = calcValeur(p.ref);
      if (v > 0) {
        famTotal += v;
        famCount++;
        var s = saisie[p.ref] || {};
        var qtyLabel = '';
        if (s.cartons > 0 && s.unites > 0) qtyLabel = s.cartons + ' crt + ' + s.unites + ' u';
        else if (s.cartons > 0) qtyLabel = s.cartons + ' crt';
        else if (s.unites > 0) qtyLabel = s.unites + ' u';
        detailRows += '<tr><td style="padding-left:24px;font-size:.78rem;color:#666">' + p.nom + '</td><td style="font-size:.78rem;color:#666">' + qtyLabel + ' x ' + (s.prix || 0).toFixed(2) + '</td><td class="val" style="font-size:.78rem">' + v.toFixed(2) + '</td></tr>';
      }
    }

    if (famCount > 0) {
      var icon = FAMILLES_ICONS[fam] || '';
      html += '<tr class="fam-row" onclick="toggleRecapDetail(\'' + fi + '\')" style="cursor:pointer"><td>' + icon + ' ' + fam + '</td><td>' + famCount + '</td><td class="val" style="font-weight:900;color:#1b5e20">' + famTotal.toFixed(2) + ' EUR</td></tr>';
      html += '<tbody id="recap-detail-' + fi + '" style="display:none">' + detailRows + '</tbody>';
      totalGeneral += famTotal;
      totalProduits += famCount;
    }
  }

  html += '<tr class="total-row"><td>TOTAL GENERAL</td><td>' + totalProduits + ' produits</td><td class="val">' + totalGeneral.toFixed(2) + ' EUR</td></tr>';
  html += '</tbody></table>';

  document.getElementById('recap-content').innerHTML = html;
  document.getElementById('recap-date').textContent = 'Inventaire du ' + new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric'});
}

window.toggleRecapDetail = function(fi) {
  var el = document.getElementById('recap-detail-' + fi);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
};

// ─── NAVIGATION ───────────────────────────────────────────
function setStep(n) {
  document.getElementById('step1').className = 'step' + (n === 1 ? ' active' : (n > 1 ? ' done' : ''));
  document.getElementById('step2').className = 'step' + (n === 2 ? ' active' : (n > 2 ? ' done' : ''));
  document.getElementById('step3').className = 'step' + (n === 3 ? ' active' : '');
}

window.goToSelection = function() {
  document.getElementById('view-selection').style.display = '';
  document.getElementById('view-saisie').style.display = 'none';
  document.getElementById('view-recap').style.display = 'none';
  document.getElementById('floating-bar').style.display = 'none';
  setStep(1);
  currentView = 'selection';
  renderSelection();
  window.scrollTo(0, 0);
};

window.goToSaisie = function() {
  var nbSel = Object.keys(selected).filter(function(r) { return selected[r]; }).length;
  if (nbSel === 0) { alert('Selectionnez au moins un produit'); return; }
  document.getElementById('view-selection').style.display = 'none';
  document.getElementById('view-saisie').style.display = '';
  document.getElementById('view-recap').style.display = 'none';
  document.getElementById('floating-bar').style.display = 'flex';
  setStep(2);
  currentView = 'saisie';
  renderSaisie();
  window.scrollTo(0, 0);
};

window.goToRecap = function() {
  document.getElementById('view-selection').style.display = 'none';
  document.getElementById('view-saisie').style.display = 'none';
  document.getElementById('view-recap').style.display = '';
  document.getElementById('floating-bar').style.display = 'none';
  setStep(3);
  currentView = 'recap';
  renderRecap();
  window.scrollTo(0, 0);
};

window.goToSaisieFromRecap = function() {
  window.goToSaisie();
};

// ─── EXPORT EXCEL ─────────────────────────────────────────
window.exportExcel = function() {
  var byFam = getProductsByFamily();
  var rows = [['Famille','Ref','Designation','Cartons','Unites','Prix HT','Valeur HT']];
  var totalGeneral = 0;

  for (var fi = 0; fi < FAMILLES_ORDER.length; fi++) {
    var fam = FAMILLES_ORDER[fi];
    var prods = byFam[fam];
    if (!prods) continue;
    var selProds = prods.filter(function(p) { return selected[p.ref]; });

    for (var j = 0; j < selProds.length; j++) {
      var p = selProds[j];
      var v = calcValeur(p.ref);
      if (v > 0) {
        var s = saisie[p.ref] || {};
        rows.push([fam, p.ref, p.nom, s.cartons || 0, s.unites || 0, s.prix || 0, Math.round(v * 100) / 100]);
        totalGeneral += v;
      }
    }
  }

  rows.push([]);
  rows.push(['','','','','','TOTAL', Math.round(totalGeneral * 100) / 100]);

  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:35},{wch:8},{wch:40},{wch:10},{wch:10},{wch:10},{wch:12}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inventaire');
  var dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, 'Inventaire_Compta_' + dateStr + '.xlsx');
};

// ─── EXPORT PDF ───────────────────────────────────────────
window.exportPDF = function() {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF('p', 'mm', 'a4');
  var dateStr = new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric'});

  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text('Inventaire Comptable', 14, 20);
  doc.setFontSize(10);
  doc.setFont(undefined, 'normal');
  doc.text('La Mie Caline Valence — ' + dateStr, 14, 27);

  var byFam = getProductsByFamily();
  var tableRows = [];
  var totalGeneral = 0;

  for (var fi = 0; fi < FAMILLES_ORDER.length; fi++) {
    var fam = FAMILLES_ORDER[fi];
    var prods = byFam[fam];
    if (!prods) continue;
    var selProds = prods.filter(function(p) { return selected[p.ref]; });
    var famTotal = 0;
    var famRows = [];

    for (var j = 0; j < selProds.length; j++) {
      var p = selProds[j];
      var v = calcValeur(p.ref);
      if (v > 0) {
        var s = saisie[p.ref] || {};
        famRows.push([p.nom, (s.cartons || 0) + '', (s.unites || 0) + '', (s.prix || 0).toFixed(2), v.toFixed(2)]);
        famTotal += v;
      }
    }

    if (famRows.length > 0) {
      tableRows.push([{content: fam, colSpan: 4, styles: {fontStyle: 'bold', fillColor: [230,245,230]}}, {content: famTotal.toFixed(2) + ' EUR', styles: {fontStyle: 'bold', fillColor: [230,245,230], halign: 'right'}}]);
      for (var k = 0; k < famRows.length; k++) tableRows.push(famRows[k]);
      totalGeneral += famTotal;
    }
  }

  tableRows.push([{content: 'TOTAL GENERAL', colSpan: 4, styles: {fontStyle: 'bold', fillColor: [200,230,200]}}, {content: totalGeneral.toFixed(2) + ' EUR', styles: {fontStyle: 'bold', fillColor: [200,230,200], halign: 'right'}}]);

  doc.autoTable({
    startY: 33,
    head: [['Designation', 'Crt', 'Uni', 'Prix HT', 'Valeur']],
    body: tableRows,
    styles: {fontSize: 7, cellPadding: 2},
    headStyles: {fillColor: [46, 125, 50], textColor: 255, fontStyle: 'bold'},
    columnStyles: {0: {cellWidth: 80}, 1: {cellWidth: 15, halign: 'center'}, 2: {cellWidth: 15, halign: 'center'}, 3: {cellWidth: 20, halign: 'right'}, 4: {cellWidth: 25, halign: 'right'}},
    margin: {left: 14, right: 14}
  });

  doc.save('Inventaire_Compta_' + new Date().toISOString().slice(0, 10) + '.pdf');
};

// ─── SAVE SESSION FIREBASE ────────────────────────────────
window.saveSession = function() {
  var dateStr = new Date().toISOString().slice(0, 10);
  var byFam = getProductsByFamily();
  var session = {
    date: dateStr,
    user: (user.nom || user.name || '?'),
    timestamp: new Date().toISOString(),
    familles: {},
    totalGeneral: 0
  };

  for (var fi = 0; fi < FAMILLES_ORDER.length; fi++) {
    var fam = FAMILLES_ORDER[fi];
    var prods = byFam[fam];
    if (!prods) continue;
    var selProds = prods.filter(function(p) { return selected[p.ref]; });
    var famData = {produits: {}, total: 0};

    for (var j = 0; j < selProds.length; j++) {
      var p = selProds[j];
      var v = calcValeur(p.ref);
      if (v > 0) {
        var s = saisie[p.ref] || {};
        famData.produits[p.ref] = {nom: p.nom, cartons: s.cartons || 0, unites: s.unites || 0, prix: s.prix || 0, valeur: Math.round(v * 100) / 100};
        famData.total += v;
      }
    }
    famData.total = Math.round(famData.total * 100) / 100;
    if (Object.keys(famData.produits).length > 0) {
      session.familles[fam] = famData;
      session.totalGeneral += famData.total;
    }
  }
  session.totalGeneral = Math.round(session.totalGeneral * 100) / 100;

  fbReady.then(function() {
    set(ref(db, 'inventaire-compta/sessions/' + dateStr), session).then(function() {
      alert('Inventaire sauvegarde ! Total: ' + session.totalGeneral.toFixed(2) + ' EUR');
      // Clear brouillon
      localStorage.removeItem('inv_compta_brouillon');
    }).catch(function(e) {
      alert('Erreur sauvegarde: ' + e.message);
    });
  });
};

// ─── INIT ─────────────────────────────────────────────────
renderSelection();

</script>
