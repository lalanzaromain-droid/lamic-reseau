<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Admin Catalogue</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-produit { display:flex; align-items:center; gap:8px; padding:10px 8px; border-bottom:1px solid var(--border); }
    .admin-produit .nom { flex:1; font-size:0.9rem; }
    .admin-produit .ref { font-size:0.8rem; color:var(--text-light); width:60px; }
    .admin-produit .ordre { width:50px; text-align:center; font-size:0.85rem; color:var(--primary); font-weight:700; }
    .admin-actions { display:flex; gap:4px; }
    .admin-actions button { padding:6px 10px; border:none; border-radius:6px; font-size:0.8rem; cursor:pointer; }
    .btn-edit { background:#e8f0fe; color:var(--primary); }
    .btn-del { background:#fee2e2; color:var(--danger); }
    .form-row { display:flex; gap:8px; margin-bottom:10px; }
    .form-row input, .form-row select { flex:1; }
    #import-zone { border:2px dashed var(--border); border-radius:var(--radius); padding:30px; text-align:center; color:var(--text-light); margin-bottom:16px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <button class="header-btn" onclick="location.href='accueil.html'">&larr; Retour</button>
    </div>
    <h1>Admin Catalogue</h1>
  </div>

  <div class="container">
    <!-- Sélection type -->
    <div class="tabs">
      <button class="tab active" data-type="surgeles">Surgeles</button>
      <button class="tab" data-type="frais">Frais</button>
      <button class="tab" data-type="boissons">Boissons</button>
    </div>

    <!-- Import CSV -->
    <div id="import-zone" onclick="document.getElementById('csv-file').click()">
      Importer un CSV<br><small>nom;ref;categorie;conditionnement;ordre_fournisseur;ventes_jour_defaut</small>
      <input type="file" id="csv-file" accept=".csv" style="display:none">
    </div>

    <!-- Ajouter produit -->
    <div class="card">
      <h3 style="margin-bottom:12px">Ajouter un produit</h3>
      <div class="form-row">
        <input type="text" id="add-nom" placeholder="Nom">
        <input type="text" id="add-ref" placeholder="Ref" style="max-width:80px">
      </div>
      <div class="form-row">
        <input type="text" id="add-cat" placeholder="Categorie">
        <input type="text" id="add-cond" placeholder="Conditionnement">
      </div>
      <div class="form-row">
        <input type="number" id="add-ordre" placeholder="Rang fournisseur" style="max-width:100px">
        <input type="number" id="add-ventes" placeholder="Ventes/jour" step="0.1" style="max-width:100px">
        <button class="btn btn-primary" id="btn-add">Ajouter</button>
      </div>
    </div>

    <!-- Liste produits -->
    <div class="card" style="padding:0;overflow:hidden">
      <div id="produits-list"></div>
    </div>

    <div style="text-align:center;padding:12px">
      <span id="count" style="font-size:0.85rem;color:var(--text-light)"></span>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { getCatalogue, setCatalogueProduit, deleteCatalogueProduit } from './js/firestore.js';
    import { showToast, showModal, showLoader, hideLoader } from './js/ui.js';

    let currentType = 'surgeles';
    let produits = [];

    // Onglets type
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentType = tab.dataset.type;
        loadProduits();
      });
    });

    requireAuth(async () => {
      await loadProduits();
    });

    async function loadProduits() {
      showLoader();
      produits = await getCatalogue(currentType);
      produits.sort((a, b) => (a.ordre_fournisseur || 999) - (b.ordre_fournisseur || 999));
      hideLoader();
      renderProduits();
    }

    function renderProduits() {
      const list = document.getElementById('produits-list');
      document.getElementById('count').textContent = `${produits.length} produit${produits.length > 1 ? 's' : ''}`;

      if (produits.length === 0) {
        list.innerHTML = '<p style="padding:20px;text-align:center;color:var(--text-light)">Aucun produit</p>';
        return;
      }

      list.innerHTML = produits.map(p => `
        <div class="admin-produit">
          <div class="ordre">${p.ordre_fournisseur || '—'}</div>
          <div class="nom">
            ${p.nom}
            <div style="font-size:0.75rem;color:var(--text-light)">${p.categorie || ''} &middot; ${p.conditionnement || ''} &middot; ${p.ventes_jour_defaut || 0}/j</div>
          </div>
          <div class="ref">${p.ref_fournisseur || ''}</div>
          <div class="admin-actions">
            <button class="btn-edit" onclick="editProduit('${p.id}')">Modifier</button>
            <button class="btn-del" onclick="delProduit('${p.id}', '${p.nom.replace(/'/g, "\\'")}')">X</button>
          </div>
        </div>
      `).join('');
    }

    // Ajouter
    document.getElementById('btn-add').addEventListener('click', async () => {
      const nom = document.getElementById('add-nom').value.trim();
      if (!nom) { showToast('Nom requis'); return; }

      const id = nom.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
      const data = {
        nom,
        ref_fournisseur: document.getElementById('add-ref').value.trim(),
        categorie: document.getElementById('add-cat').value.trim(),
        conditionnement: document.getElementById('add-cond').value.trim(),
        ordre_fournisseur: parseInt(document.getElementById('add-ordre').value) || 999,
        ventes_jour_defaut: parseFloat(document.getElementById('add-ventes').value) || 0,
        actif: true
      };

      await setCatalogueProduit(currentType, id, data);
      showToast(`${nom} ajoute`);
      document.querySelectorAll('#add-nom,#add-ref,#add-cat,#add-cond,#add-ordre,#add-ventes').forEach(i => i.value = '');
      await loadProduits();
    });

    // Supprimer
    window.delProduit = async (id, nom) => {
      if (!confirm(`Supprimer "${nom}" ?`)) return;
      await deleteCatalogueProduit(currentType, id);
      showToast(`${nom} supprime`);
      await loadProduits();
    };

    // Modifier
    window.editProduit = (id) => {
      const p = produits.find(x => x.id === id);
      if (!p) return;

      showModal('Modifier produit', `
        <div class="input-group">
          <label>Nom</label>
          <input type="text" id="edit-nom" value="${p.nom}">
        </div>
        <div class="input-group">
          <label>Reference</label>
          <input type="text" id="edit-ref" value="${p.ref_fournisseur || ''}">
        </div>
        <div class="input-group">
          <label>Categorie</label>
          <input type="text" id="edit-cat" value="${p.categorie || ''}">
        </div>
        <div class="input-group">
          <label>Conditionnement</label>
          <input type="text" id="edit-cond" value="${p.conditionnement || ''}">
        </div>
        <div class="form-row">
          <div class="input-group" style="flex:1">
            <label>Rang fournisseur</label>
            <input type="number" id="edit-ordre" value="${p.ordre_fournisseur || ''}">
          </div>
          <div class="input-group" style="flex:1">
            <label>Ventes/jour</label>
            <input type="number" id="edit-ventes" step="0.1" value="${p.ventes_jour_defaut || 0}">
          </div>
        </div>
      `, [
        { label: 'Annuler', class: 'btn btn-outline', action: () => {} },
        { label: 'Enregistrer', class: 'btn btn-primary', action: async () => {
          const data = {
            nom: document.getElementById('edit-nom').value.trim(),
            ref_fournisseur: document.getElementById('edit-ref').value.trim(),
            categorie: document.getElementById('edit-cat').value.trim(),
            conditionnement: document.getElementById('edit-cond').value.trim(),
            ordre_fournisseur: parseInt(document.getElementById('edit-ordre').value) || 999,
            ventes_jour_defaut: parseFloat(document.getElementById('edit-ventes').value) || 0,
            actif: true
          };
          await setCatalogueProduit(currentType, id, data);
          showToast('Produit modifie');
          await loadProduits();
        }}
      ]);
    };

    // Import CSV
    document.getElementById('csv-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const text = await file.text();
      const lines = text.split('\n').filter(l => l.trim());
      const header = lines[0].toLowerCase();

      // Détecter le séparateur
      const sep = header.includes(';') ? ';' : ',';

      let count = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(sep).map(c => c.trim());
        if (cols.length < 2) continue;

        const nom = cols[0];
        if (!nom) continue;

        const id = nom.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
        const data = {
          nom,
          ref_fournisseur: cols[1] || '',
          categorie: cols[2] || '',
          conditionnement: cols[3] || '',
          ordre_fournisseur: parseInt(cols[4]) || (i),
          ventes_jour_defaut: parseFloat(cols[5]) || 0,
          actif: true
        };

        await setCatalogueProduit(currentType, id, data);
        count++;
      }

      showToast(`${count} produits importes`);
      e.target.value = '';
      await loadProduits();
    });
  </script>
</body>
</html>
